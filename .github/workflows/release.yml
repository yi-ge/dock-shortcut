name: Release macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    environment: macos-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source
        shell: bash
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Sign and notarize the disk image
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: MD2Y658336
        run: |
          set -u
          : "${DEVELOPER_ID_P12_BASE64:?Missing DEVELOPER_ID_P12_BASE64}"
          : "${DEVELOPER_ID_P12_PASSWORD:?Missing DEVELOPER_ID_P12_PASSWORD}"
          : "${ASC_KEY_P8_BASE64:?Missing ASC_KEY_P8_BASE64}"
          : "${MACOS_NOTARY_KEY_ID:?Missing ASC_KEY_ID}"
          : "${MACOS_NOTARY_ISSUER_ID:?Missing ASC_ISSUER_ID}"
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/dock-shortcut-signing.XXXXXX")"
          keychain="$signing_dir/release.keychain-db"
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            find "$signing_dir" -depth -delete
          }
          trap cleanup EXIT
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -D > "$signing_dir/identity.p12"
          export MACOS_NOTARY_KEY_PATH="$signing_dir/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -D > "$MACOS_NOTARY_KEY_PATH"
          unset DEVELOPER_ID_P12_BASE64 ASC_KEY_P8_BASE64

          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/identity.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          unset DEVELOPER_ID_P12_PASSWORD
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" | awk -v team="$APPLE_TEAM_ID" '
            index($0, "Developer ID Application:") && index($0, "(" team ")") {print $2}
          ')"
          if [[ ! "$identity" =~ ^[0-9A-F]{40}$ ]]; then
            echo "Expected one valid Developer ID Application identity for team $APPLE_TEAM_ID." >&2
            exit 1
          fi
          export MACOS_SIGN_IDENTITY="$identity"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            export EXPECTED_RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          ./release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarized-macos-universal
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notarized-macos-universal
          path: dist
      - name: Publish the verified release
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="Dock.Shortcut.${GITHUB_REF_NAME#v}.dmg"
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes "$artifact" SHA256SUMS.txt
